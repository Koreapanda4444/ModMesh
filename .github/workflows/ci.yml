name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install pinned dependencies
        run: python -m pip install -c requirements.lock ".[desktop,server,dev]"
      - name: Lint
        run: python -m ruff check src tools packaging
      - name: Check formatting
        run: python -m ruff format --check src tools packaging
      - name: Type check
        run: python -m mypy
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Install built wheel
        run: python -c "import pathlib,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(next(pathlib.Path('dist').glob('*.whl')))])"
      - name: Exercise desktop event loop
        run: modmesh --check
      - name: Exercise server health endpoint
        run: modmesh-server --check
      - name: Verify file safety, version drift and transactional rollback
        run: python tools/verify_safety.py
      - name: Verify server migrations
        run: python tools/verify_server.py
      - name: Verify account UI and session isolation
        run: python tools/verify_accounts.py
      - name: Verify standalone deployment
        run: python tools/verify_deployment.py

  server:
    name: PostgreSQL server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: modmesh-ci-only
          POSTGRES_DB: modmesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MODMESH_TEST_DATABASE_URL: postgresql+psycopg://postgres:modmesh-ci-only@127.0.0.1:5432/modmesh_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned server dependencies
        run: python -m pip install -c requirements.lock ".[server]"
      - name: Verify PostgreSQL migrations and API
        run: python tools/verify_server.py

  container:
    name: Container deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned server dependencies
        run: python -m pip install -c requirements.lock ".[server]"
      - name: Build and verify Docker Compose deployment
        run: python tools/verify_deployment.py --container

  windows_package:
    name: Windows standalone packages
    needs: [build, server, container]
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned packaging dependencies
        run: python -m pip install -c requirements.lock ".[desktop,package]"
      - name: Build portable and per-user installer with source notices
        run: python tools/build_windows.py
      - name: Verify native standalone installation and user file preservation
        run: python tools/verify_windows_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ModMesh-windows-x64
          path: |
            dist/windows/*-portable.zip
            dist/windows/*-setup.exe
            dist/windows/*-sources.zip
            dist/windows/SHA256SUMS.txt
            dist/windows/verification.json
          if-no-files-found: error
          retention-days: 30
