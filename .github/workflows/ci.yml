name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install pinned dependencies
        run: python -m pip install -c requirements.lock ".[desktop,server,dev]"
      - name: Lint
        run: python -m ruff check src
      - name: Check formatting
        run: python -m ruff format --check src
      - name: Type check
        run: python -m mypy
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Install built wheel
        run: python -c "import pathlib,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(next(pathlib.Path('dist').glob('*.whl')))])"
      - name: Exercise desktop event loop
        run: modmesh --check
      - name: Exercise server health endpoint
        run: modmesh-server --check
